name: Daily News & AI Summary

on:
  schedule:
    # 매일 한국시간 오전 8시 23분 (UTC 23:23)
    - cron: '23 23 * * *'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  summarize:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run News Aggregator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python news_aggregator.py

  keepalive:
    if: github.event_name == 'schedule'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh repository activity marker
        run: |
          marker=".github/workflow-keepalive"
          last_commit="$(git log -1 --format=%ct -- "$marker" || true)"
          now="$(date -u +%s)"

          if [ -n "$last_commit" ] && [ $((now - last_commit)) -lt 2592000 ]; then
            echo "Keepalive marker is less than 30 days old."
            exit 0
          fi

          date -u +"%Y-%m-%dT%H:%M:%SZ" > "$marker"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$marker"
          git commit -m "chore: refresh workflow activity"
          git push

